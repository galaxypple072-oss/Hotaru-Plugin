<style>
/* Layout: one full-screen stage. A slab of mixed-size covers is tilted in 3D, and the camera glides to whichever cover is selected. */
:root{
  --bg:#06080c;
  --slab:#0c1016;
  --fg:#eef2f7;
  --muted:#8c96a6;
  --accent:#8fd3ff;
  --line:rgba(255,255,255,.14);
  --font-display:'Bricolage Grotesque','Noto Sans TC',system-ui,sans-serif;
  --font-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --u:116px;
  --gap:4px;
  --ease:cubic-bezier(.22,.8,.2,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);overflow:hidden}
button,input{font:inherit;color:inherit}

.bg{position:fixed;inset:-12%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4) brightness(.5);opacity:0;transition:opacity 1.1s ease}
.bg.on{opacity:1}

.stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 38%;overflow:hidden;
  -webkit-mask-image:radial-gradient(ellipse 88% 82% at 50% 46%,#000 52%,transparent 100%);
  mask-image:radial-gradient(ellipse 88% 82% at 50% 46%,#000 52%,transparent 100%);
  filter:blur(var(--blur,0px));transition:filter .8s var(--ease)}
.stage.warp{transition:filter .27s ease-in}
.wall{position:absolute;left:50%;top:44%;transform-origin:0 0;transform-style:preserve-3d;
  display:grid;grid-template-columns:repeat(var(--cols,9),var(--u));grid-auto-rows:var(--u);grid-auto-flow:dense;gap:var(--gap);
  padding:var(--gap);background:var(--slab);border-radius:6px;box-shadow:0 90px 150px rgba(0,0,0,.7);
  translate:var(--tx,0px) 0;scale:var(--sc,1);opacity:var(--op,1);
  transition:transform 1.1s var(--ease),translate .8s cubic-bezier(.16,1,.3,1),scale .8s cubic-bezier(.16,1,.3,1),opacity .5s ease-out}
.wall.warp{transition:transform 1.1s var(--ease),translate .27s cubic-bezier(.55,0,.9,.45),scale .27s cubic-bezier(.55,0,.9,.45),opacity .22s ease-in}
.wall.snap{transition:none!important}

.tile{position:relative;display:block;border:0;padding:0;margin:0;text-align:left;cursor:pointer;overflow:hidden;border-radius:2px;
  background:#111 center/cover no-repeat;transform:translateZ(0);
  filter:blur(var(--b,0px)) brightness(.5);
  transition:filter .7s var(--ease),transform .9s var(--ease),box-shadow .7s var(--ease)}
.tile.miss{filter:blur(var(--b,0px)) brightness(.28)}
.tile:hover{filter:blur(0) brightness(.9)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tile.on{filter:none;transform:translateZ(46px) scale(1.035);box-shadow:0 0 0 2px rgba(255,255,255,.92),0 36px 80px rgba(0,0,0,.65)}
.tile .badge{position:absolute;left:8px;top:8px;padding:1px 7px;border-radius:2px;background:rgba(0,0,0,.55);font:400 10px/1.6 var(--font-mono);letter-spacing:.04em}
.tile .meta{position:absolute;left:0;right:0;bottom:0;padding:30px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.74));display:block}
.tile .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 14px/1.2 var(--font-display);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tile.big .t{font-size:21px}
.tile .y{display:block;margin-top:2px;font:400 10px/1.4 var(--font-mono);color:rgba(255,255,255,.62)}

header{position:fixed;top:0;left:0;right:0;z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(6,8,12,.88),transparent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{font:700 15px/1 var(--font-display);letter-spacing:.02em}
.brand span{margin-left:8px;color:var(--muted);font:400 11px var(--font-mono);letter-spacing:.08em}
.tabs{display:flex;gap:4px;min-width:0}
.tab{border:0;background:none;cursor:pointer;padding:6px 12px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.tab b{margin-left:6px;font:400 11px var(--font-mono);opacity:.7}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:#06080c;background:var(--fg)}
.tab:focus-visible,.seg button:focus-visible,.ib:focus-visible,#add:focus-visible,.chip:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);backdrop-filter:blur(12px)}
.seg button{border:0;background:none;cursor:pointer;padding:3px 12px;border-radius:999px;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.18);color:var(--fg)}

.ask{margin-top:12px;max-width:620px}
#askf{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(14,18,24,.7);backdrop-filter:blur(14px)}
#q::placeholder{color:var(--muted)}
#askf button{border:0;cursor:pointer;padding:0 20px;border-radius:999px;background:var(--accent);color:#06080c;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:rgba(14,18,24,.55);backdrop-filter:blur(10px);cursor:pointer;padding:2px 11px;border-radius:999px;font-size:12px;color:var(--muted)}
.chip:hover{color:var(--fg)}
.trace{margin-top:8px;font:400 12px/1.5 var(--font-mono);color:var(--accent);min-height:18px}

footer{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:16px;
  padding:56px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(6,8,12,.82));pointer-events:none}
footer>*{pointer-events:auto}
.now{min-width:0;max-width:440px}
.nk{font:400 11px/1.4 var(--font-mono);letter-spacing:.1em;color:var(--accent)}
.nt{margin-top:2px;font:700 clamp(20px,2.4vw,30px)/1.15 var(--font-display);text-wrap:balance}
.ns{margin-top:2px;color:var(--muted);font-size:12px}
.nx{margin:8px 0 0;font-size:13px;color:rgba(238,242,247,.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 10px;border-radius:999px;min-width:min(480px,100%);box-sizing:border-box;
  background:rgba(18,22,28,.62);border:1px solid var(--line);backdrop-filter:blur(18px)}
.ib{display:grid;place-items:center;width:34px;height:34px;flex:none;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--fg)}
.ib:hover{background:rgba(255,255,255,.12)}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib.play{width:42px;height:42px;background:var(--fg);color:#06080c}
.ib.play:hover{background:#fff}
.time{font:400 11px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
#bar{position:relative;flex:1;min-width:60px;height:22px;cursor:pointer;display:flex;align-items:center}
#bar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
#fill{position:relative;display:block;height:4px;border-radius:2px;background:var(--fg);width:0}
.side{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;min-width:0}
#add{border:1px solid var(--line);background:rgba(18,22,28,.62);backdrop-filter:blur(14px);cursor:pointer;padding:7px 16px;border-radius:999px;font-size:13px}
#add:hover{background:rgba(255,255,255,.14)}
#add[data-done="1"]{color:var(--accent);cursor:default}
.hint{font-size:11px;line-height:1.5;color:var(--muted)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translate(-50%,-8px);z-index:8;max-width:calc(100% - 32px);padding:8px 16px;border-radius:999px;
  background:rgba(238,242,247,.94);color:#06080c;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  :root{--u:84px}
  footer{grid-template-columns:minmax(0,1fr);gap:12px}
  .pill{min-width:0;justify-self:stretch}
  .side{justify-self:stretch;flex-direction:row;justify-content:space-between;align-items:center;text-align:left}
  .hint span{display:none}
  .nx{-webkit-line-clamp:1}
}
@media (prefers-reduced-motion:reduce){
  .wall,.wall.warp,.stage,.stage.warp,.tile,.bg,#toast{transition-duration:.01s}
}

.scene{position:absolute;inset:0;transform-origin:50% 44%;will-change:transform,opacity}
.empty-panel{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 48px));box-sizing:border-box;padding:32px;border:1px solid var(--line);border-radius:20px;background:rgba(14,18,24,.8);backdrop-filter:blur(20px)}
.empty-panel h2{font:700 26px/1.3 var(--font-display);margin:12px 0}.empty-panel p{color:var(--muted);line-height:1.8;margin:0}
#apple-region{max-width:100px;border:1px solid var(--line);border-radius:24px;background:#171c24;color:var(--text);padding:0 10px;font:inherit}#askf{flex-wrap:wrap}#askf input{min-width:140px;flex:1}header{padding-right:90px}.tile:disabled{cursor:default}button:disabled{opacity:.45;cursor:default}
#apple-playlist{min-width:220px;max-width:65vw;border:1px solid var(--line);border-radius:30px;background:#171c24;color:var(--fg);padding:14px 22px;font:inherit}#askf input[hidden]{display:none}
@media(max-width:760px){header{padding-right:72px}.bar{gap:12px}.brand span{display:none}.tabs{order:3;width:100%}.stage{perspective:1000px}.wall{top:43%}.hint{display:none}.nt{font-size:22px}.now{max-width:100%}}
</style>

<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>

<header>
  <div class="bar">
    <div class="brand">音樂日記<span>COVER WALL</span></div>
    <div class="tabs" role="tablist" aria-label="板塊">
      <button class="tab" role="tab" id="tab-original" data-tab="original" aria-selected="false">純音樂<b id="n-original"></b></button>
      <button class="tab" role="tab" id="tab-cover" data-tab="cover" aria-selected="false">萤的翻唱<b id="n-cover"></b></button>
      <button class="tab" role="tab" id="tab-found" data-tab="found" aria-selected="true">我的歌單<b id="n-found"></b></button>
    </div>
    <div class="seg" role="group" aria-label="檢視方式">

    </div>
  </div>
  <div class="ask" id="ask" hidden>
    <form id="askf">
      <input id="q" type="text" placeholder="告訴 AI 你想聽什麼，例如：適合下雨天的鋼琴曲" autocomplete="off" aria-label="描述想找的歌">
      <button type="submit">找歌</button>
    </form>
    <div class="chips">
      <button type="button" class="chip">適合下雨天的鋼琴曲</button>
      <button type="button" class="chip">深夜回家路上聽的</button>
      <button type="button" class="chip">咖啡店的爵士背景音樂</button>
    </div>
    <div class="trace" id="trace" aria-live="polite"></div>
  </div>
</header>

<main class="stage" id="stage">
  <div class="scene" id="scene" data-phase="idle"><div class="wall" id="wall"></div><section id="empty-panel" class="empty-panel" hidden><div class="nk">MUSIC DIARY</div><h2></h2><p></p></section></div>
</main>

<footer>
  <div class="now">
    <div class="nk" id="nk"></div>
    <div class="nt" id="nt"></div>
    <div class="ns" id="ns"></div>
    <p class="nx" id="nx"></p>
  </div>
  <div class="pill">
    <button class="ib" id="prev" type="button" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="ib play" id="play" type="button" aria-label="播放"></button>
    <button class="ib" id="next" type="button" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg></button>
    <span class="time" id="cur">00:00</span>
    <div id="bar" role="slider" aria-label="播放進度" tabindex="0"><span id="fill"></span></div>
    <span class="time" id="tot">00:00</span>
  </div>
  <div class="side">
    <button id="add" type="button" hidden>加入日記</button>
    <div class="hint"><span>方向鍵切換 · 空格播放 · </span>示例數據，音頻為瀏覽器即時合成</div>
  </div>
</footer>
<div id="toast" role="status"></div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  function rng(seed){var t=seed>>>0;return function(){t+=0x6D2B79F5;var r=Math.imul(t^(t>>>15),1|t);r^=r+Math.imul(r^(r>>>7),61|r);return((r^(r>>>14))>>>0)/4294967296}}
  var pad=function(n){return String(n).padStart(2,'0')};
  var fmt=function(s){s=Math.max(0,Math.floor(s));return pad(Math.floor(s/60))+':'+pad(s%60)};

  var ORIG=[], COVER=[], CATALOG=[];
  /* ---------- generated covers ---------- */
  var IMG={};

  }


  function send(type, extra){parent.postMessage(Object.assign({channel:'hotaru-wall',type:type},extra||{}),'*')}
  function stopAudio(){send('pause')}
  function startAudio(it){if(it)send('play',{id:it.id,time:S.t})}
  /* ---------- state & view ---------- */

    $('#nk').textContent=it.kind==='original'?'AI 純音樂':it.kind==='cover'?'AI 翻唱':(it.hit?'AI 找到 · 匹配':'示例目錄');

  function depth(){

  }

      ?'rotateX(56deg) rotateZ(-36deg) translate3d('+(-c[0])+'px,'+(-c[1])+'px,0)'

    setTimeout(function(){st.classList.remove('warp');st.style.setProperty('--blur','0px')},240);

  /* ---------- interactions ---------- */

  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab)})});
  var toastT;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
  $('#add').addEventListener('click',function(){if(cur())send('details',{id:cur().id})});
  function move(dx,dy){
    if(S.view==='tilt'){var a=36*Math.PI/180,ux=dx*Math.cos(a)-dy*Math.sin(a),uy=dx*Math.sin(a)+dy*Math.cos(a);dx=ux;dy=uy}
    var s=tiles[S.sel];if(!s)return;var c=cxy(s),best=-1,bs=1e9;
    tiles.forEach(function(t,k){

      if(along<=4)return;var across=Math.abs(vx*dy-vy*dx),sc=along+across*2;

  document.addEventListener('keydown',function(e){

    e.preventDefault();
  });
  var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){depth();camera(true)},120)});


  $('#bar').addEventListener('keydown',function(e){if(!cur())return;var delta=e.key==='ArrowRight'?5:e.key==='ArrowLeft'?-5:null;if(delta===null)return;e.preventDefault();e.stopPropagation();S.t=Math.max(0,Math.min(cur().dur,S.t+delta));send('seek',{id:cur().id,time:S.t});progress()});
  var libraryLoaded=false;
  var oldInfo=info;info=function(){oldInfo();if(cur()){$('#add').hidden=false;$('#add').textContent='日記與聽後感';$('#add').dataset.done='';$('#play').disabled=!cur().available;$('#nx').textContent=cur().text||cur().statusText||''}else{$('#play').disabled=true}};
  window.addEventListener('message',function(e){

  });
  $('#askf').addEventListener('submit',function(e){e.preventDefault()});
  // A stable snapshot of one real playlist; playback never replaces its songs.
  var playlistRequest=0,playlistId=null,playlistName='',playlistLoaded=false,libraryError='',playlistArtwork={};
  var playlistSelect=document.createElement('select');playlistSelect.id='apple-playlist';playlistSelect.setAttribute('aria-label','Apple Music 歌單');
  var loadingOption=document.createElement('option');loadingOption.textContent='正在讀取心水歌曲…';playlistSelect.appendChild(loadingOption);
  $('#q').hidden=true;$('#askf button').hidden=true;$('.chips').hidden=true;$('#askf').appendChild(playlistSelect);
  var refreshButton=document.createElement('button');refreshButton.type='button';refreshButton.textContent='刷新歌單';$('#askf').appendChild(refreshButton);
  var suggestButton=document.createElement('button');suggestButton.type='button';suggestButton.textContent='讓萤推薦';$('#askf').appendChild(suggestButton);
  suggestButton.addEventListener('click',function(){send('apple-suggest')});

  function requestPlaylist(id){libraryError='';$('#trace').textContent='正在讀取歌單…';send('apple-playlist',{id:id,requestId:++playlistRequest})}
  $('#trace').textContent='正在讀取心水歌曲…';
  $('#ask').hidden=S.tab!=='found';
  var diaryCover=cover;

  var diaryInfo=info;

    diaryInfo();if(S.tab!=='found')return;$('#add').hidden=true;
    if(cur()){$('#nk').textContent=playlistName||'我的歌單';$('#ns').textContent=cur().sub;$('#nx').textContent='來自 Apple Music · '+S.items.found.length+' 首歌曲'}
    else{$('#nk').textContent='我的歌單';$('#nt').textContent=playlistName||'心水歌曲';$('#ns').textContent='';$('#nx').textContent=libraryError||'正在讀取你的歌單…'}
  };
  var diaryEmptyState=emptyState;
  emptyState=function(){

    emptyPanel.querySelector('h2').textContent=libraryError?'歌單暫時載入不了':playlistLoaded?'這張歌單還沒有歌曲':'正在讀取心水歌曲…';
    emptyPanel.querySelector('p').textContent=libraryError||(playlistLoaded?'讓萤推薦幾首，選好後加入這張歌單。':'歌曲和封面會一起留在這裡。');

  function wallItem(t,i){return {id:t.id,kind:'found',title:t.title,sub:t.artist+' · '+t.album,date:'',dur:t.duration||0,

  var diarySelect=select,diaryStart=startAudio;
  startAudio=function(it){if(it&&it.kind==='found'){S.playing=false;syncPlay()}diaryStart(it)};
  function renderLibrary(m,turn){

  }

  }
  window.addEventListener('message',function(e){
    if(e.source!==parent||!e.data||e.data.channel!=='hotaru-host')return;var m=e.data;

      playlistSelect.innerHTML='';(m.playlists||[]).forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;playlistSelect.appendChild(o)});
